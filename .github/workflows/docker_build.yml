name: Docker Build & Verification

on:
  push:
    branches: [ "main" ]
    paths:
      - "deploy/**"
      - "tdc_studio/**"
      - "api.py"
      - "pyproject.toml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "deploy/**"
      - "tdc_studio/**"
      - "api.py"
      - "pyproject.toml"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Serving Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.serving
          push: false
          tags: tdc-studio-serving:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
