# Optimized Configuration for Caco-2 Wang (Post-HPO 50-Epoch Benchmark Tuning)
# Tuned on NVIDIA T4 GPU via Colab CLI (Trial #1, Val MAE: 0.3993, Val RMSE: 0.5427, Val R2: 0.5009)

data:
  type: "admet_loader"
  dataset_name: "caco2_wang"
  split_type: "scaffold"
  batch_size: 32
  max_epochs: 50
  metric_name: "composite"
  params:
    dataset_name: "caco2_wang"
    split_type: "scaffold"
    task_type: "regression"

model:
  type: "graph_transformer"
  in_dim: 14
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1283700262312818
  loss_type: "smooth_l1"
  huber_beta: 1.0

lr: 0.0034469254123653016
max_epochs: 50
early_stopping: 15

tracking:
  project: "tdc-learning"
  entity: "tdc-studio"
  enabled: true
