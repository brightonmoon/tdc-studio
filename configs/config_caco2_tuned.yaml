# Optimized Configuration for Caco-2 Wang (Phase 1: Target Standardization + 210 RDKit Descriptors)
# Tuned on NVIDIA T4 GPU via Colab CLI (Trial #1 base + RDKit 2D Features)

data:
  type: "admet_loader"
  dataset_name: "caco2_wang"
  split_type: "scaffold"
  batch_size: 32
  max_epochs: 80
  metric_name: "composite"
  params:
    dataset_name: "caco2_wang"
    split_type: "scaffold"
    task_type: "regression"
    use_descriptors: true
    standardize_target: true

model:
  type: "graph_transformer"
  in_dim: 14
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1283700262312818
  use_descriptors: true
  descriptor_dim: 210
  loss_type: "smooth_l1"
  huber_beta: 1.0

lr: 0.0034469254123653016
max_epochs: 80
early_stopping: 20

tracking:
  project: "tdc-learning"
  entity: "tdc-studio"
  enabled: true
