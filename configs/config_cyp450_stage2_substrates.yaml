data:
  type: admet_cluster_loader
  dataset_name: cyp450_substrates_transfer
  split_type: scaffold
  batch_size: 32
  seed: 42
  modality: graph
  primary_task: cyp3a4_substrate_carbonmangels
  metric_name: roc_auc
  use_descriptors: true
  standardize_target: false
  tasks:
    - name: cyp3a4_substrate_carbonmangels
      category: metabolism
      type: binary_classification
    - name: cyp2d6_substrate_carbonmangels
      category: metabolism
      type: binary_classification
    - name: cyp2c9_substrate_carbonmangels
      category: metabolism
      type: binary_classification

model:
  type: dmpnn_mtl
  in_dim: 14
  edge_dim: 6
  hidden_dim: 450
  num_layers: 4
  dropout: 0.15
  use_descriptors: true
  descriptor_dim: 210
  tasks:
    - name: cyp3a4_substrate_carbonmangels
      type: binary_classification
    - name: cyp2d6_substrate_carbonmangels
      type: binary_classification
    - name: cyp2c9_substrate_carbonmangels
      type: binary_classification
  task_weights:
    cyp3a4_substrate_carbonmangels: 1.0
    cyp2d6_substrate_carbonmangels: 1.0
    cyp2c9_substrate_carbonmangels: 1.0
  use_uncertainty: false

pretrained_checkpoint: models/checkpoint_cyp450_stage1/best_model.pt
freeze_backbone_epochs: 3

lr: 0.0001
weight_decay: 1.0e-5
max_epochs: 35
early_stopping: 12
eval_metric: roc_auc

tracking:
  enabled: true
  project: tdc-learning
  entity: tdc-studio
