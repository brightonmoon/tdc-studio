# ============================================================
# TDC Studio — DTI Phase C Config (Cross-Attention Fusion + Staged Fine-Tuning)
# ============================================================
# Target Evaluation: BindingDB_Kd on Cold Drug Split
# Phase C Targets:
#   - Primary Metric: Cold-Drug CI >= 0.76 (Phase B baseline: 0.7464)
#   - Secondary Metric: Cold-Drug MSE <= 0.65 (Phase B baseline: 0.6609)
#
# Innovations:
#   - Fusion: Bidirectional Multi-Head Cross-Attention (Atom-Residue contact modeling + XAI)
#   - Drug Encoder: ChemBERTa-77M-MTR with Staged Top-2 Layer Unfreezing
#   - Target Encoder: facebook/esm2_t12_35M_UR50D with High-Speed In-Memory Embedding Cache
# ============================================================

task: dti

# ── Dataset ──────────────────────────────────────────────
dataset:
  name: BindingDB_Kd        # 52K pairs, 10K+ unique drugs
  split: cold_drug          # Evaluate on unseen drugs
  seed: 42
  frac: [0.7, 0.1, 0.2]
  log_transform: true       # log1p(Kd in nM)
  aa_max_length: 1024       # Context length for ESM-2

# ── Model ─────────────────────────────────────────────────
model:
  type: graph_dta

  drug_encoder:
    type: chembert_encoder
    model_name: "DeepChem/ChemBERTa-77M-MTR"
    hidden_dim: 384
    out_dim: 256
    max_length: 256
    pooling: mean
    freeze_backbone: true   # Initially frozen for Stage 1 warmup
    dropout: 0.1

  target_encoder:
    type: esm2_encoder
    model_name: "facebook/esm2_t12_35M_UR50D"
    hidden_dim: 480
    out_dim: 256
    max_length: 1024
    pooling: mean
    freeze_backbone: true   # Kept frozen to exploit 30x in-memory cache
    gradient_checkpointing: false
    dropout: 0.1

  fusion:
    type: cross_attention_fusion
    drug_dim: 256
    target_dim: 256
    hidden_dim: 256
    num_heads: 4
    dropout: 0.1
    out_dim: 1

  use_domain_adaptation: false

# ── Training & Staged Fine-Tuning ─────────────────────────
training:
  batch_size: 32            # Optimal for Colab T4 16GB
  max_epochs: 18
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 2
  gradient_clip_val: 1.0
  early_stopping_patience: 6
  early_stopping_metric: val_ci

staged_training:
  stage1_epochs: 3            # Epochs 1..3: Train CrossAttention head with frozen ChemBERTa
  stage2_unfreeze_layers: 2   # Epochs 4+: Unfreeze top 2 RoBERTa transformer layers
  stage2_backbone_lr: 1.0e-5  # Delicate learning rate for pretrained backbone
  stage2_head_lr: 5.0e-5      # Adapted LR for head in Stage 2

# ── Evaluation ────────────────────────────────────────────
evaluation:
  primary_metric: ci
  secondary_metrics: [mse, rmse, pearson]
  reference_split: cold_drug
  target_thresholds:
    ci: 0.76                  # Target >= 0.76
    mse: 0.65                 # Target <= 0.65

# ── Tracking ──────────────────────────────────────────────
tracking:
  project: tdc-studio-dti
  run_name: phase_c_cross_attention_staged_finetuning
  tags: [dti, cold_drug, phase_c, cross_attention, xai, staged_finetuning]
  log_every_n_steps: 10

# ── Export ────────────────────────────────────────────────
export:
  save_dir: models/dti/phase_c
  formats: [pytorch]
  checkpoint_name: best_model.pt
