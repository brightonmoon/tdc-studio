# ============================================================
# TDC Studio — DTI Phase D Config (3D Pocket Cross-Attention & Dual-Modal Drug)
# ============================================================
# Targets:
#   - Pocket-Guided Cross Attention modeling atom-residue contacts on 3D binding pockets
#   - Dual-Modal Drug Encoder fusing 2D topology and 3D ETKDG spatial conformation
#   - Conformal Prediction 95% Confidence Intervals for UQ
# ============================================================

task: dti

# ── Data & Dataset ────────────────────────────────────────
data:
  type: dta_loader
  dataset_name: DAVIS
  split_type: cold_protein
  seed: 42
  frac: [0.7, 0.1, 0.2]
  log_transform: false       # DAVIS is already pKd (-log10 Kd)
  aa_max_length: 256         # Concentrated binding pocket window

dataset:
  name: DAVIS
  split: cold_protein
  seed: 42
  frac: [0.7, 0.1, 0.2]
  log_transform: false
  aa_max_length: 256

# ── Model ─────────────────────────────────────────────────
model:
  type: graph_dta

  drug_encoder:
    type: dual_modal_drug_encoder
    hidden_dim: 256
    out_dim: 256
    num_rbf: 32
    use_3d_coordinates: true
    dropout: 0.1

  target_encoder:
    type: protein_cnn
    out_dim: 256
    kernel_sizes: [3, 5, 7]
    dropout: 0.1

  fusion:
    type: pocket_cross_attention_fusion
    drug_dim: 256
    target_dim: 256
    hidden_dim: 256
    num_heads: 4
    distance_scale: 0.1
    pocket_cutoff: 10.0
    dropout: 0.15
    out_dim: 1

  use_domain_adaptation: false

# ── Training ──────────────────────────────────────────────
training:
  batch_size: 32
  max_epochs: 15
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 2
  gradient_clip_val: 1.0
  early_stopping_patience: 10
  early_stopping_metric: val_ci

# ── Evaluation ────────────────────────────────────────────
evaluation:
  primary_metric: ci
  secondary_metrics: [mse, rmse, pearson]
  reference_split: cold_protein
  target_thresholds:
    ci: 0.85
    mse: 0.30
  conformal_prediction:
    alpha: 0.05
    ad_threshold_multiplier: 1.5

# ── Tracking ──────────────────────────────────────────────
tracking:
  project: tdc-studio-dti
  run_name: phase_d_pocket_3d_cross_attention
  tags: [dti, davis, pocket_attention, 3d_conformation, dual_modal, conformal_uq]
  log_every_n_steps: 10

# ── Export ────────────────────────────────────────────────
export:
  save_dir: models/dti/phase_d_pocket
  formats: [pytorch]
  checkpoint_name: best_model.pt
