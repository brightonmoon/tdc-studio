data:
  type: admet_cluster_loader
  dataset_name: lipophilicity_mtl
  split_type: scaffold
  batch_size: 64
  seed: 42
  modality: graph
  primary_task: lipophilicity_astrazeneca
  metric_name: mae
  use_descriptors: true
  standardize_target: true
  tasks:
    - name: lipophilicity_astrazeneca
      category: physicochemical
      type: regression
    - name: solubility_aqsoldb
      category: physicochemical
      type: regression
    - name: hydrationfreeenergy_freesolv
      category: physicochemical
      type: regression
    - name: caco2_wang
      category: absorption
      type: regression

model:
  type: dmpnn_mtl
  in_dim: 14
  edge_dim: 6
  hidden_dim: 350
  num_layers: 3
  dropout: 0.15
  use_descriptors: true
  descriptor_dim: 210
  tasks:
    - name: lipophilicity_astrazeneca
      type: regression
    - name: solubility_aqsoldb
      type: regression
    - name: hydrationfreeenergy_freesolv
      type: regression
    - name: caco2_wang
      type: regression
  task_weights:
    lipophilicity_astrazeneca: 2.0
    solubility_aqsoldb: 0.5
    hydrationfreeenergy_freesolv: 0.3
    caco2_wang: 0.5
  use_uncertainty: false

lr: 0.0008
weight_decay: 1.0e-5
max_epochs: 60
early_stopping: 20
eval_metric: mae

tracking:
  enabled: true
  project: tdc-learning
  entity: tdc-studio
