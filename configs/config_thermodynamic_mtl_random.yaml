# Configuration for Thermodynamic Triad Multi-Task Learning on Random Split (8:1:1)
# Cross-Task Pretraining across ~19,800 compounds:
# Solubility (AqSolDB 9,982) + Lipophilicity (4,200) + BBB (2,030) + PPBR (1,614) + VDss (1,130) + Caco-2 (906)

data:
  type: admet_cluster_loader
  dataset_name: thermodynamic_mtl
  split_type: random
  batch_size: 64
  seed: 42
  modality: graph
  primary_task: ppbr_az
  metric_name: r2
  use_descriptors: true
  standardize_target: true
  tasks:
    - name: ppbr_az
      category: distribution
      type: regression
      transform: logit
    - name: lipophilicity_astrazeneca
      category: physicochemical
      type: regression
    - name: solubility_aqsoldb
      category: physicochemical
      type: regression
    - name: bbb_martins
      category: distribution
      type: binary_classification
    - name: vdss_lombardo
      category: distribution
      type: regression
    - name: caco2_wang
      category: absorption
      type: regression

model:
  type: dmpnn_mtl
  in_dim: 14
  edge_dim: 6
  hidden_dim: 450
  num_layers: 4
  dropout: 0.20
  use_descriptors: true
  descriptor_dim: 210
  tasks:
    - name: ppbr_az
      type: regression
    - name: lipophilicity_astrazeneca
      type: regression
    - name: solubility_aqsoldb
      type: regression
    - name: bbb_martins
      type: binary_classification
    - name: vdss_lombardo
      type: regression
    - name: caco2_wang
      type: regression
  task_weights:
    ppbr_az: 2.0
    lipophilicity_astrazeneca: 0.7
    solubility_aqsoldb: 0.6
    bbb_martins: 0.3
    vdss_lombardo: 0.2
    caco2_wang: 0.1
  use_uncertainty: true
  pearson_weight: 0.30

lr: 0.0006
min_lr: 1.0e-6
weight_decay: 1.0e-5
max_epochs: 45
early_stopping: 18
eval_metric: r2

tracking:
  project: "tdc-learning"
  entity: "tdc-studio"
  enabled: true
