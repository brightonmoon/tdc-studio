sampler: "tpe"
direction: "minimize"
pruner:
  type: "MedianPruner"
  n_startup_trials: 5
  n_warmup_steps: 2

search_space:
  lr:
    type: "float"
    low: 0.00005
    high: 0.005
    log: true
  hidden_dim:
    type: "categorical"
    choices: [64, 128, 256]
  dropout:
    type: "float"
    low: 0.05
    high: 0.3
