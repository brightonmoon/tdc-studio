[project]
name = "tdc-studio"
version = "0.1.0"
description = "Modular MLOps Studio for Therapeutics Data Commons with Cloud GPU Orchestration"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "brightonmoon" }]
keywords = [
    "admet",
    "drug-discovery",
    "therapeutics-data-commons",
    "cheminformatics",
    "molecular-property-prediction",
    "graph-neural-network",
    "multi-task-learning",
    "mlops",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "setuptools<72",
    "numpy>=1.26.4,<2.0.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "rdkit>=2023.9.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "optuna>=4.0.0",
    "wandb>=0.20.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "pandas>=2.1.4",
    "scikit-learn>=1.9.1",
    "transformers>=4.50.3",
]

[project.optional-dependencies]
tdc = [
    "PyTDC>=1.1.15",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[project.scripts]
tdc-studio = "tdc_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
